      (c.why?'<div style="font-size:12px;margin-top:4px">'+esc(c.why)+'</div>':'')+
      (c.tells?'<div class="hint" style="margin-top:3px">👀 Check: '+esc(c.tells)+'</div>':'')+
      '<div class="row" style="margin-top:8px"><a class="btn btn-s btn-sm" style="flex:1;text-decoration:none" href="https://www.google.com/search?tbm=isch&q='+q+'" target="_blank" rel="noopener">🖼 See photos</a>'+
      '<button class="btn btn-p btn-sm" style="flex:1" onclick="idPick('+i+')">✓ That\'s it</button></div></div>';}).join('');
  if(ID.question){
    h+='<div class="sec" style="margin-top:12px;border-color:var(--accent1)"><b>🤔 '+esc(ID.question.q)+'</b><div class="chips" style="flex-wrap:wrap;margin-top:6px">'+
      (ID.question.options||[]).map(function(o,i){return'<button class="chip" onclick="idAnswer('+i+')">'+esc(o)+'</button>';}).join('')+'</div></div>';
  }
  if(ID.via)h+='<div class="hint" style="margin-top:6px;text-align:right">via '+esc(ID.via)+'</div>';
  h+='<div class="row" style="margin-top:10px"><input class="m-in" id="id-more" placeholder="Not these? Say what\'s different…" onkeydown="if(event.key===\'Enter\')idRefine()"><button class="btn btn-p" onclick="idRefine()">↻</button></div>';
  h+='<div class="hint" style="margin-top:4px">Tip: in Google photos, long-press the right picture → <b>Share → Spotted</b> to use it as the item photo.</div>';
  return h;
}
function idDrill(i){var m=ID.family.members[i];ID.drill=ID.drill===m.name?'':m.name;ID.excluded=[];idRun();}
function idAnswer(i){var q=ID.question;ID.answers.push(q.q+' → '+q.options[i]);idRun();}
function idRefine(){var v=(($('id-more')||{}).value||'').trim();(ID.results||[]).forEach(function(c){if(ID.excluded.indexOf(c.name)<0)ID.excluded.push(c.name);});if(v)ID.answers.push('Correction: '+v);idRun();}
function idRun(){
  var desc=idDescribe();
  if(!desc.trim()||(!ID.text.trim()&&!ID.feats.length&&!ID.brands.length&&!ID.photo&&!ID.answers.length))return toast('Tap a few details or type a description first');
  ID.busy=true;ID.results=ID.results||[];rID();
  var sys='You identify specific products (sneakers, streetwear, clothing, collectibles, cars, etc.) from a hurried, imperfect description by someone who saw it in public and could not take a clear photo. '+
    'Work like an expert reseller, in two levels: (1) the MODEL FAMILY / LINE, then (2) the exact model version + colorway. '+
    'If the user names or hints at a family/line (e.g. "one of the Blasts", "Jordan with a strap", "a Dunk", "Nimbus-ish", "North Face puffer"), STAY INSIDE that family: do not substitute other lines just because they share colors. '+
    'For the most likely family, list EVERY current and recent model/version in it (e.g. ASICS Blast line = Novablast 1-5, Superblast 1-2, Megablast, Sonicblast, Dynablast 1-5, Gel-Blast FF / FF 2 / FF 3, Magic Speed if relevant; Jordan with a strap = Air Jordan 8 and its variants), each with the single most useful visual tell that separates it from its siblings (sole shape, stack height, logo placement, upper pattern, heel). '+
    'Candidates must be exact searchable names incl. colorway as listed on StockX/GOAT/the brand site; when unsure of the version, spread candidates across different family members in the user\'s colors rather than across other families. '+
    'Return ONLY JSON: {"family":{"name":"family/line name","members":[{"name":"exact model/version name","tell":"how to tell it apart at a glance","years":"release years"}]},'+
    '"candidates":[{"name":"exact searchable product name incl. colorway","colorway":"","year":"","confidence":0-100,"why":"one sentence linking it to their description","tells":"1-2 visible features to confirm","search":"best Google Images query"}],'+
    '"question":{"q":"ONE short visual question whose answer best separates the remaining options","options":["2-5 short answer choices"]}}. Up to 15 family members, up to 6 candidates, best first. No markdown.';
  var user='What I saw:\n'+desc+(ID.drill?'\n\nCONFIRMED MODEL: '+ID.drill+'. Only give candidates of this exact model (its versions/generations and colorways that fit the colors I saw); keep the family list as context.':'')+(ID.excluded.length?'\n\nIt is NOT any of these: '+ID.excluded.join('; '):'');
  var done=function(e,txt){
    ID.busy=false;
    if(e){ID.results=ID.results&&ID.results.length?ID.results:null;rID();
      var msg=e.friendly?'Gemini refused every free model this key can use (quota). Usually this means the free daily/minute limit is used up, or this key\'s project has no free tier.\n\nLast error: '+(e.message||'').slice(0,220)+'\n\nTry again in a minute, add a Claude key in ⚙️ → 🔎 Identify, or tap ❓ Save for later.':'⚠️ '+(e.message||e);
      return setTimeout(function(){alert(msg);},50);}
    var j=null;try{var m=String(txt).match(/\{[\s\S]*\}/);j=JSON.parse(m?m[0]:txt);}catch(x){}
    if(!j){ID.results=[];ID.question=null;rID();return toast('AI reply could not be read — try again');}
    ID.results=(j.candidates||[]).filter(function(c){return c&&c.name;});ID.question=j.question&&j.question.q?j.question:null;if(j.family&&(j.family.members||[]).length&&!ID.drill)ID.family=j.family;rID();
  };
  var prov=idProvider();
  var send=function(img){if(prov==='claude')_claudeID(sys,user,img,done);else _geminiID(sys,user,img,done);};
  if(ID.photo)resizeData(ID.photo,1024,'jpeg',0.85).then(send);else send(null);
}
function _claudeID(sys,user,img,cb){
  var content=[];if(img)content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:img.split(',')[1]}});content.push({type:'text',text:user});
  fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':aiKeyClaude(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:(L.claudeModel||'claude-sonnet-5-5').trim(),max_tokens:3000,system:sys,messages:[{role:'user',content:content}]})})
  .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error((j.error&&j.error.message)||('Claude HTTP '+r.status));return j;});})
  .then(function(j){cb(null,(j.content||[]).map(function(b){return b.text||'';}).join(''));}).catch(function(e){cb(e);});
}
// Free-tier quotas differ per model and Google Search grounding often has none,
// so on a quota/404 error walk down a list of cheaper models (without search) until one answers.
function _geminiID(sys,user,img,cb){
  var parts=[];if(img)parts.push({inline_data:{mime_type:'image/jpeg',data:img.split(',')[1]}});parts.push({text:user});
  var first=(L.geminiTextModel||'gemini-flash-latest').trim();
  var chain=[[first,true],[first,false]];
  [L.geminiTextOK,'gemini-flash-lite-latest','gemini-2.5-flash','gemini-2.5-flash-lite','gemini-flash-latest'].forEach(function(m){if(m&&!chain.some(function(c){return c[0]===m&&!c[1];}))chain.push([m,false]);});
  if(L.geminiTextOK&&L.geminiTextOK!==first)chain.unshift([L.geminiTextOK,false]);// start with what worked last time
  var i=0,lastErr='';
  (function go(){
    if(i>=chain.length){var e=new Error(lastErr);e.friendly=true;return cb(e);}
    var m=chain[i][0],useSearch=chain[i][1];i++;
    var body={systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts:parts}]};
    if(useSearch)body.tools=[{google_search:{}}];else body.generationConfig={responseMimeType:'application/json'};
    fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':L.geminiKey},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(j){
      if(!r.ok){lastErr=(j.error&&j.error.message)||('Gemini HTTP '+r.status);
        if(r.status===429||r.status===404||r.status===400||r.status===503){console.warn('Gemini',m,useSearch?'+search':'',r.status,lastErr);return go();}
        throw new Error(lastErr);}
      var p=((j.candidates||[])[0]||{}).content,txt=(p&&p.parts||[]).map(function(x){return x.text||'';}).join('');
      if(!txt){lastErr='empty reply from '+m;return go();}
      if(L.geminiTextOK!==m){L.geminiTextOK=m;svL();}
      ID.via=m+(useSearch?' + Google Search':'');
      cb(null,txt);});}).catch(function(e){lastErr=e.message||String(e);go();});
  })();
}
function idPick(i){
  var c=ID.results[i];
  var note=c.name+(c.colorway?' — '+c.colorway:'')+'\nSeen as: '+idDescribe().replace(/\n/g,'; ');
  // already have it? just log a sighting
  var ex=vals(S.items).find(function(x){return x.name.toLowerCase()===c.name.toLowerCase();});
  if(ID.itemId&&S.items[ID.itemId]){
    var it=clone(S.items[ID.itemId]);
    if(ex&&ex.id!==it.id&&confirm('You already have "'+ex.name+'". Merge this mystery\'s sightings into it?')){
      itemSightings(it.id).forEach(function(s){var s2=clone(s);s2.item=ex.id;put('sightings',s2);});deleteItemById(it.id);closeModal(1);render();return openItemModal(ex.id);}
    it.name=c.name;it.mystery=false;it.notes=(it.notes?it.notes+'\n':'')+note;put('items',it);closeModal(1);render();toast('❓ → '+c.name);return openItemModal(it.id);
  }
  closeModal(1);
  if(ex){var s=addSighting({item:ex.id,date:ID.date,place:ID.place});toast('✅ Logged another sighting of '+ex.name);render();return openItemModal(ex.id);}
  openItemModal(null,{name:c.name,cat:ID.cat});
  IM.f.notes=note;IM.first.place=ID.place;IM.first.date=ID.date;
  if(ID.photo)studioAdd(ID.photo,'Photo',true);else rItem();
  toast('Add a photo from Google: long-press → Copy image → 📋 Paste, or Share → Spotted',5000);
}
function idSaveMystery(){
  var desc=idDescribe();if(!desc.trim())return toast('Describe it a little first');
  if(ID.itemId){var it0=clone(S.items[ID.itemId]);it0.desc=desc;put('items',it0);closeModal(1);return toast('Saved');}
  var short=(ID.text.trim()||[ID.brands[0],ID.colors.slice(0,2).join('/'),ID.feats.slice(0,2).join(', ')].filter(Boolean).join(' ')).slice(0,48);
  var it={id:'it_'+gid(),name:'❓ '+(short||'Mystery item'),cat:ID.cat,mystery:true,desc:desc,notes:desc,folders:[],created:now(),img:''};
  var finish=function(){put('items',it);addSighting({item:it.id,date:ID.date,place:ID.place,note:'unidentified'});if(ID.place){L.lastPlace=ID.place;L.lastPlaceDay=tod();svL();}closeModal(1);render();toast('❓ Saved — identify it later from the item or the ❓ filter',3500);};
  if(ID.photo)resizeData(ID.photo,900,'webp',0.85).then(function(d){it.img=imgSave(d);finish();});else finish();
}
