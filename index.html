<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spotted">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<meta name="description" content="Spotted — item bingo and sighting tracker">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
<title>Spotted · Item Bingo</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{
  --paper:#ffffff;--paperDark:#f5f5f5;--paperGrid:#e0e0e0;
  --ink:#111;--inkLight:#555;--inkFaint:#999;
  --accent1:#111;--accent2:#555;
  --washi1:rgba(0,0,0,0.04);--shadow:rgba(0,0,0,0.07);
  --good:#16a34a;--warn:#f59e0b;--bad:#ef4444;
  --check:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 50%/16px 16px;
}
[data-theme="dark"]{
  --paper:#0a0a0a;--paperDark:#151515;--paperGrid:#262626;
  --ink:#e5e5e5;--inkLight:#aaa;--inkFaint:#666;
  --accent1:#e5e5e5;--accent2:#aaa;
  --washi1:rgba(255,255,255,0.05);--shadow:rgba(0,0,0,0.4);
  --check:repeating-conic-gradient(#1c1c1c 0% 25%,#121212 0% 50%) 50%/16px 16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden;max-width:100%}
body{font-family:Quicksand,sans-serif;color:var(--ink);background:var(--paper);overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;color:var(--ink)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--paperGrid);border-radius:4px}

/* ── Shell ── */
.app{display:flex;flex-direction:column;min-height:100vh;max-width:100vw;overflow-x:hidden;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--paperGrid)}
.brand{font-family:'Permanent Marker',cursive;font-size:22px;letter-spacing:.5px;line-height:1}
.brand small{font-family:Quicksand;font-size:9px;color:var(--inkFaint);letter-spacing:0;margin-left:4px}
.spacer{flex:1}
.me-pill{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 4px;border-radius:20px;border:1px solid var(--paperGrid);background:var(--paper);font-size:12px;font-weight:600}
.sync-dot{font-size:10px;white-space:nowrap}
.icon-btn{border:none;background:transparent;font-size:18px;padding:4px 6px;border-radius:8px}
.icon-btn:active{background:var(--washi1)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:var(--paper);border-top:1px solid var(--paperGrid);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;border:none;background:none;padding:8px 0 10px;font-size:10px;font-weight:600;color:var(--inkFaint);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button .ti{font-size:20px;line-height:1}
.tabbar button.on{color:var(--ink)}
.tabbar button.on .ti{transform:scale(1.1)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:61;border:none;border-radius:28px;background:var(--accent1);color:var(--paper);font-weight:700;font-size:15px;padding:14px 20px;box-shadow:0 6px 18px rgba(0,0,0,.25);display:flex;align-items:center;gap:6px}
.fab:active{transform:scale(.96)}
.fab2{bottom:calc(140px + env(safe-area-inset-bottom));padding:12px 14px;font-size:18px;background:var(--paper);color:var(--ink);border:1px solid var(--paperGrid)}
.content{padding:10px 12px 20px;flex:1;min-width:0}
.row>*{min-width:0}
.li .t,.li .s{overflow:hidden;text-overflow:ellipsis}

/* ── Controls ── */
.btn{padding:7px 12px;border-radius:8px;border:none;font-size:13px;font-weight:600;transition:all .12s;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--accent1);color:var(--paper)}
.btn-s{background:var(--paper);color:var(--ink);border:1px solid var(--paperGrid)}
.btn-g{background:transparent;color:var(--inkLight)}
.btn-d{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn-sm{font-size:11px;padding:4px 8px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.m-in{padding:9px 12px;border-radius:10px;border:1px solid var(--paperGrid);background:var(--paper);font-size:15px;outline:none;width:100%}
.m-in:focus{border-color:var(--accent2)}
textarea.m-in{min-height:64px;resize:vertical}
.m-lbl{font-size:11px;font-weight:700;color:var(--inkLight);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 5px;display:flex;align-items:center;gap:6px}
.m-lbl .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600}
.hint{font-size:11px;color:var(--inkFaint);line-height:1.45}
.row{display:flex;gap:6px;align-items:center}
.wrap{flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 11px;border-radius:16px;border:1px solid var(--paperGrid);background:var(--paper);font-size:12px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip.on{background:var(--accent1);color:var(--paper);border-color:var(--accent1)}
.chip .x{opacity:.6;margin-left:2px}
.pdot{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;flex-shrink:0}
.pdot.sm{width:15px;height:15px;font-size:8px}
.seg{display:flex;border:1px solid var(--paperGrid);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:none;background:var(--paper);padding:7px 6px;font-size:12px;font-weight:600;color:var(--inkLight)}
.seg button.on{background:var(--accent1);color:var(--paper)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0}
.toggle input{width:18px;height:18px;accent-color:var(--accent1)}
.empty{text-align:center;padding:40px 16px;color:var(--inkFaint);font-size:14px;line-height:1.6}
.empty .big{font-size:44px;margin-bottom:6px}

/* ── Modal (bottom sheet on phone) ── */
.mo-ov{position:fixed;inset:0;background:rgba(20,16,12,.42);backdrop-filter:blur(3px);z-index:1000;display:flex;align-items:flex-end;justify-content:center}
.mo{background:var(--paper);width:100%;max-width:560px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(0,0,0,.2);animation:up .18s ease-out}
@media(min-width:700px){.mo-ov{align-items:center}.mo{border-radius:16px;max-height:88vh}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.mo-h{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.mo-h h3{font-size:19px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mo-b{padding:4px 16px 16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.mo-f{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--paperGrid)}
.mo-f .btn{flex:1;padding:11px}
.mo-ov.l2{z-index:1100}.mo-ov.l3{z-index:1200}

/* ── Items grid ── */
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.inv-grid>*{min-width:0}
@media(max-width:600px){.inv-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.inv-card{position:relative;border-radius:12px;background:var(--paper);border:1px solid var(--paperGrid);overflow:hidden;box-shadow:0 1px 4px var(--shadow);user-select:none;-webkit-user-select:none}
.inv-card:active{transform:scale(.98)}
.inv-imgw{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:var(--paperDark);overflow:hidden}
.inv-imgw img{width:100%;height:100%;object-fit:cover}
.inv-noimg{font-size:42px;opacity:.5}
.inv-info{padding:7px 9px 8px}
.inv-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-meta{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:10px;color:var(--inkFaint);min-height:15px}
.ribbon{position:absolute;top:8px;left:-2px;z-index:3;padding:2px 8px 2px 6px;font-size:10px;font-weight:700;color:#fff;border-radius:0 5px 5px 0;background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 1px 3px rgba(0,0,0,.3)}
/* multi-select */
.inv-card.sel{outline:3px solid var(--accent1);outline-offset:-3px}
.sticker .inv-card.sel{outline-offset:2px;border-radius:12px}
.selbox{position:absolute;top:6px;right:6px;z-index:4;width:24px;height:24px;border-radius:50%;border:2px solid var(--accent1);background:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.inv-card.sel .selbox{background:var(--accent1);color:var(--paper)}
.selbar{position:fixed;left:8px;right:8px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:62;display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:14px;background:var(--paper);border:1px solid var(--paperGrid);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.bc .others{position:absolute;top:2px;right:2px;display:flex;gap:1px}
.score{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.score .chip{cursor:pointer}
.ribbon.none{background:linear-gradient(135deg,#9ca3af,#6b7280)}
/* sticker (dashed outline) mode */
.sticker .inv-card{background:transparent;border:none;box-shadow:none;overflow:visible}
.sticker .inv-imgw{background:transparent;aspect-ratio:auto;min-height:120px}
.sticker .inv-imgw img{object-fit:contain;height:auto;max-height:46vw}
@media(min-width:600px){.sticker .inv-imgw img{max-height:210px}}
.sticker .inv-imgw img[data-cut="pending"]{opacity:.35}
.sticker .inv-info{text-align:center;padding:2px}
.sticker .inv-meta{justify-content:center}
.sticker .ribbon{top:2px;left:2px;border-radius:5px}

/* ── Calendar ── */
.cal-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cal-h h2{font-size:20px;flex:1;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-cell{min-width:0;overflow:hidden}
.cal-dow{font-size:10px;font-weight:700;text-align:center;color:var(--inkFaint);padding:2px 0}
.cal-cell{min-height:64px;border:1px solid var(--paperGrid);border-radius:8px;padding:2px;position:relative;background:var(--paper);display:flex;flex-direction:column}
.cal-cell.out{opacity:.35}
.cal-cell.today{border-color:var(--accent1);border-width:2px}
.cal-cell .dn{font-size:10px;font-weight:700;color:var(--inkLight)}
.cal-thumbs{display:flex;flex-wrap:wrap;gap:1px;margin-top:1px}
.cal-thumbs img,.cal-thumbs span{width:20px;height:20px;border-radius:4px;object-fit:contain;background:var(--paperDark);font-size:12px;display:flex;align-items:center;justify-content:center}
.cal-more{font-size:9px;color:var(--inkFaint);font-weight:700}
.cal-dots{position:absolute;right:3px;top:3px;display:flex;gap:1px}
.cal-dots i{width:6px;height:6px;border-radius:50%;display:block}
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0}
.stat{border:1px solid var(--paperGrid);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:10px;color:var(--inkFaint);font-weight:600}

/* ── Bingo ── */
.card-list{display:grid;gap:10px}
.card-tile{border:1px solid var(--paperGrid);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center;background:var(--paper)}
.mini{display:grid;gap:2px;width:64px;height:64px;flex-shrink:0}
.mini i{border-radius:2px;background:var(--paperGrid)}
.mini i.d{background:var(--accent1)}
.mini i.f{background:#f59e0b}
.bingo-wrap{max-width:560px;margin:0 auto}
.bingo-title{text-align:center;font-family:'Permanent Marker',cursive;font-size:26px;margin:4px 0 2px}
.bingo-letters{display:grid;gap:4px;margin-bottom:4px}
.bingo-letters b{text-align:center;font-family:'Permanent Marker',cursive;font-size:22px}
.bingo{display:grid;gap:4px;padding:6px;border:3px solid var(--accent1);border-radius:14px;background:var(--paper)}
.bc{position:relative;aspect-ratio:1/1;border:1px solid var(--paperGrid);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px;overflow:hidden;background:var(--paper);text-align:center}
.bc img{max-width:100%;max-height:72%;object-fit:contain}
.bc .bl{font-size:10px;font-weight:700;line-height:1.1;max-height:2.3em;overflow:hidden;margin-top:1px;word-break:break-word}
.size-5 .bc .bl{font-size:8.5px}
.bc .bic{font-size:24px;line-height:1}
.size-5 .bc .bic{font-size:18px}
.bc.free{background:repeating-linear-gradient(45deg,var(--paperDark),var(--paperDark) 6px,var(--paper) 6px,var(--paper) 12px)}
.bc.empty{border-style:dashed;color:var(--inkFaint)}
.bc .kind{position:absolute;top:2px;left:3px;font-size:9px;opacity:.6}
.bc .lock{position:absolute;top:2px;right:3px;font-size:9px}
.bc .stamp{position:absolute;inset:8%;border-radius:50%;opacity:.42;mix-blend-mode:multiply;pointer-events:none;animation:stamp .25s ease-out}
[data-theme="dark"] .bc .stamp{mix-blend-mode:screen;opacity:.5}
@keyframes stamp{from{transform:scale(1.6);opacity:0}to{transform:scale(1)}}
.bc .by{position:absolute;bottom:2px;right:2px;display:flex;gap:1px}
.bc.win{box-shadow:0 0 0 2px #f59e0b inset}
.bc.done img{filter:none}
.bingo-banner{text-align:center;font-family:'Permanent Marker',cursive;font-size:34px;color:#f59e0b;text-shadow:2px 2px 0 var(--accent1);margin:6px 0;animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.confetti{position:fixed;top:-10px;width:8px;height:14px;z-index:2000;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ── Photo studio ── */
.studio{border:1px solid var(--paperGrid);border-radius:12px;padding:8px}
.studio-prev{position:relative;width:100%;min-height:180px;max-height:46vh;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--check);overflow:hidden}
.studio-prev img{max-width:100%;max-height:46vh;object-fit:contain}
.studio-prev.white{background:#fff}
.studio-busy{position:absolute;inset:0;background:rgba(255,255,255,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:700;color:#111;text-align:center;padding:12px}
.spin{width:28px;height:28px;border:3px solid #ddd;border-top-color:#111;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.tools .btn{font-size:12px;padding:9px 6px}
.src-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.src-row .btn{flex-direction:column;font-size:11px;padding:10px 4px}
.src-row .btn span{font-size:20px}
.ver-row{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.ver{flex-shrink:0;width:54px;height:54px;border-radius:8px;border:2px solid var(--paperGrid);background:var(--check);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.ver img{max-width:100%;max-height:100%}
.ver.on{border-color:var(--accent1)}
.ver small{position:absolute;bottom:0;left:0;right:0;font-size:7px;background:rgba(0,0,0,.6);color:#fff;font-weight:700}
/* touch-up editor */
.te-wrap{position:relative;touch-action:none;background:var(--check);border-radius:10px;overflow:hidden;display:flex;justify-content:center}
.te-wrap canvas{max-width:100%;max-height:58vh;display:block}

/* ── Lists ── */
.li{display:flex;align-items:center;gap:8px;padding:9px 2px;border-top:1px solid var(--paperGrid)}
.li:first-child{border-top:none}
.li .grow{flex:1;min-width:0}
.li .t{font-size:14px;font-weight:600}
.li .s{font-size:11px;color:var(--inkFaint);margin-top:1px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:contain;background:var(--paperDark);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.pick{border:1px solid var(--paperGrid);border-radius:10px;padding:4px;text-align:center;background:var(--paper)}
.pick img,.pick .thumb{width:100%;height:64px;object-fit:contain;border-radius:6px}
.pick div{font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick.on{border:2px solid var(--accent1)}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--accent1);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:3000;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:up .2s}
.kbd{font-family:ui-monospace,monospace;font-size:11px;background:var(--paperDark);padding:1px 5px;border-radius:4px}
.sec{border:1px solid var(--paperGrid);border-radius:12px;padding:10px 12px;margin-top:10px}
.sec h4{font-size:14px;margin-bottom:4px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="mr"></div>
<input type="file" id="file-cam" accept="image/*" capture="environment" style="display:none">
<input type="file" id="file-gal" accept="image/*" style="display:none">
<input type="file" id="file-json" accept=".json,application/json" style="display:none">
<script>
// ════════════════════════════════════════════════════════════════
//  SPOTTED — Item Bingo  ·  companion app to Decade Journal
//  Data lives in: localStorage (state) + IndexedDB (images, backups)
//  + Firebase RTDB at rooms/<room>/bingo, bingo_images, bingo_img_meta
//  (inside the same rooms/$room node the journal uses, so the journal's
//   existing rules already allow it and nothing collides with rooms/<room>/data)
// ════════════════════════════════════════════════════════════════
var APP_VERSION='v1.5';
var COLLS=['people','categories','items','sightings','places','cards','meta','stamps','folders'];

// ── utils ──
function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function jsq(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');}
function tod(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){if(!s)return'';var p=s.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:(+p[0]===new Date().getFullYear()?undefined:'numeric')});}
function now(){return Date.now();}
function vals(o){return Object.keys(o||{}).map(function(k){return o[k];});}
function $(id){return document.getElementById(id);}
var _dbt={};function debounce(key,fn,ms){clearTimeout(_dbt[key]);_dbt[key]=setTimeout(fn,ms||300);}
function toast(msg,ms){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},ms||2200);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function clone(o){return JSON.parse(JSON.stringify(o));}

// ── local settings (never synced unless noted) ──
var LS_KEY='ib_local';

// ════════════ IndexedDB (images + state mirror + backups) ════════════
var _idb=null,_idbWait=[];
function idbOpen(cb){
  if(_idb)return cb(_idb);
  _idbWait.push(cb);if(_idbWait.length>1)return;
  var req;try{req=indexedDB.open('spotted_db',1);}catch(e){_idbWait.forEach(function(f){f(null);});_idbWait=[];return;}
  req.onupgradeneeded=function(e){var db=e.target.result;['imgs','state','cuts'].forEach(function(n){if(!db.objectStoreNames.contains(n))db.createObjectStore(n);});};
  req.onsuccess=function(e){_idb=e.target.result;var w=_idbWait;_idbWait=[];w.forEach(function(f){f(_idb);});};
  req.onerror=function(){var w=_idbWait;_idbWait=[];w.forEach(function(f){f(null);});};
}
function idbPut(store,key,val,cb){idbOpen(function(db){if(!db){cb&&cb();return;}try{var tx=db.transaction(store,'readwrite');tx.objectStore(store).put(val,key);tx.oncomplete=function(){cb&&cb();};tx.onerror=function(){cb&&cb();};}catch(e){cb&&cb();}});}
function idbGet(store,key,cb){idbOpen(function(db){if(!db)return cb(null);try{var r=db.transaction(store,'readonly').objectStore(store).get(key);r.onsuccess=function(){cb(r.result||null);};r.onerror=function(){cb(null);};}catch(e){cb(null);}});}
function idbDel(store,key){idbOpen(function(db){if(!db)return;try{db.transaction(store,'readwrite').objectStore(store).delete(key);}catch(e){}});}
function idbAll(store,cb){idbOpen(function(db){if(!db)return cb({});try{var out={};var r=db.transaction(store,'readonly').objectStore(store).openCursor();r.onsuccess=function(e){var c=e.target.result;if(c){out[c.key]=c.value;c.continue();}else cb(out);};r.onerror=function(){cb(out);};}catch(e){cb({});}});}

// ════════════ Image store ════════════
// Images are immutable: each edit creates a new key. Items point at keys.
var IMG={};           // key -> dataURL (memory)
var _imgLoading={};
function imgSave(dataUrl){
  var k='i'+gid();IMG[k]=dataUrl;idbPut('imgs',k,dataUrl);
  imgQueueUpload(k);return k;
}
function imgGet(k,cb){
  if(!k)return cb(null);
  if(IMG[k])return cb(IMG[k]);
  (_imgLoading[k]=_imgLoading[k]||[]).push(cb);
  if(_imgLoading[k].length>1)return;
  idbGet('imgs',k,function(d){
    if(d){IMG[k]=d;return _imgDone(k,d);}
    fbFetchImage(k,function(d2){if(d2){IMG[k]=d2;idbPut('imgs',k,d2);}_imgDone(k,d2);});
  });
}
function _imgDone(k,d){var w=_imgLoading[k]||[];delete _imgLoading[k];w.forEach(function(f){f(d);});}
function imgHTML(k,cls,attrs){return k?'<img data-k="'+k+'" class="'+(cls||'')+'" alt="" '+(attrs||'')+'>':'';}
// Fill every <img data-k> under root; sticker versions for data-st
function hydrate(root){
  (root||document).querySelectorAll('img[data-k]:not([data-h])').forEach(function(el){
    el.setAttribute('data-h','1');
    var k=el.getAttribute('data-k');
    var wantSticker=el.hasAttribute('data-st');
    imgGet(k,function(d){
      if(!d){el.style.display='none';return;}
      if(!wantSticker){el.src=d;return;}
      if(CUT[k]){el.src=CUT[k];el.setAttribute('data-cut','done');return;}
      el.src=d;el.setAttribute('data-cut','pending');
      stickerQueue(k,d,function(s){if(s){el.src=s;el.setAttribute('data-cut','done');}else el.removeAttribute('data-cut');});
    });
  });
}

// ════════════ Firebase sync ════════════
var FB={db:null,room:'',base:null,connected:false,listener:null,firstPull:false,writing:false,lastOk:0,err:'',paused:localStorage.getItem('ib_fb_paused')==='1'};
var DIRTY={};try{DIRTY=JSON.parse(localStorage.getItem('ib_dirty')||'{}');}catch(e){}
var KNOWN={};try{KNOWN=JSON.parse(localStorage.getItem('ib_known')||'{}');}catch(e){}
var IMGQ=[];try{IMGQ=JSON.parse(localStorage.getItem('ib_imgq')||'[]');}catch(e){}
function dirty(coll,id){DIRTY[coll+'/'+id]=1;try{localStorage.setItem('ib_dirty',JSON.stringify(DIRTY));}catch(e){}}
function fbCfg(){
  var c=null;try{c=JSON.parse(localStorage.getItem('ib_fb_config')||'null');}catch(e){}
  if(!c){try{c=JSON.parse(localStorage.getItem('fb_config')||'null');}catch(e){}}// same-origin Decade Journal config
  return c;
}
function fbRoom(){return localStorage.getItem('ib_fb_room')||localStorage.getItem('fb_room')||'';}
function fbInit(cfg,room){
  if(!cfg||!cfg.apiKey||!cfg.databaseURL||!room)return false;
  if(typeof firebase==='undefined'){FB.err='Firebase library failed to load (offline?)';return false;}
  try{
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    FB.db=firebase.database();
    if(FB.listener&&FB.base)FB.base.off('value',FB.listener);
    FB.room=room;FB.base=FB.db.ref('rooms/'+room+'/bingo');FB.connected=true;FB.firstPull=false;FB.err='';
    localStorage.setItem('ib_fb_config',JSON.stringify(cfg));localStorage.setItem('ib_fb_room',room);idbPut('state','fbcfg',JSON.stringify({config:cfg,room:room}));
    if(localStorage.getItem('ib_known_room')!==room){KNOWN={};localStorage.setItem('ib_known_room',room);_saveKnown();}
    FB.listener=FB.base.on('value',fbOnValue,function(e){FB.err=e.message||String(e);syncBadge();});
    return true;
  }catch(e){FB.err=e.message;FB.connected=false;return false;}
}
function fbDisconnect(){
  if(FB.listener&&FB.base)FB.base.off('value',FB.listener);
  FB.connected=false;FB.base=null;FB.listener=null;
  localStorage.removeItem('ib_fb_room');syncBadge();
}
function _saveKnown(){try{localStorage.setItem('ib_known',JSON.stringify(KNOWN));}catch(e){}}
function fbOnValue(snap){
  var d=snap.val()||{};
  var changed=false;
  COLLS.forEach(function(c){
    var cloud=d[c]||{};
    if(!S[c])S[c]={};
    Object.keys(cloud).forEach(function(id){
      var key=c+'/'+id;KNOWN[key]=1;
      if(DIRTY[key])return;// local edit pending — local wins until flushed
      var cv=cloud[id],lv=S[c][id];
      if(!lv||(cv.u||0)>(lv.u||0)){S[c][id]=cv;changed=true;}
    });
    Object.keys(S[c]).forEach(function(id){
      var key=c+'/'+id;
      if(cloud[id]||DIRTY[key])return;
      if(KNOWN[key]){delete S[c][id];delete KNOWN[key];changed=true;}// deleted on another device
      else dirty(c,id);// local-only (made offline / before first sync) → push up
    });
  });
  _saveKnown();
  FB.firstPull=true;FB.lastOk=now();
  if(changed){S._ts=now();_svNow();scheduleRender();if(typeof watchRemoteBingos==='function')watchRemoteBingos();}
  if(Object.keys(DIRTY).length)fbScheduleWrite();
  fbPumpImages();
  syncBadge();
}
var _fbWT=null;
function fbScheduleWrite(){if(!FB.connected||FB.paused)return;clearTimeout(_fbWT);_fbWT=setTimeout(fbFlush,600);syncBadge();}
function fbFlush(){
  _fbWT=null;
  if(!FB.connected||!FB.base||FB.paused||!FB.firstPull)return;
  var keys=Object.keys(DIRTY);if(!keys.length)return syncBadge();
  var up={};
  keys.forEach(function(k){
    var p=k.split('/'),c=p[0],id=p[1];
    var v=S[c]&&S[c][id];
    if(v&&c==='meta'&&id==='keys'&&!L.syncKeys)return;
    up[k]=v?JSON.parse(JSON.stringify(v)):null;
  });
  FB.writing=true;syncBadge();
  FB.base.update(up).then(function(){
    keys.forEach(function(k){if(up.hasOwnProperty(k)){delete DIRTY[k];if(up[k])KNOWN[k]=1;else delete KNOWN[k];}});
    try{localStorage.setItem('ib_dirty',JSON.stringify(DIRTY));}catch(e){}
    _saveKnown();FB.writing=false;FB.lastOk=now();FB.err='';syncBadge();
  }).catch(function(e){FB.writing=false;FB.err=e.message||'write failed';syncBadge();setTimeout(fbScheduleWrite,5000);});
}
function fbTogglePause(){FB.paused=!FB.paused;localStorage.setItem('ib_fb_paused',FB.paused?'1':'0');if(!FB.paused)fbScheduleWrite();syncBadge();}
// images
function imgQueueUpload(k){if(IMGQ.indexOf(k)<0)IMGQ.push(k);try{localStorage.setItem('ib_imgq',JSON.stringify(IMGQ));}catch(e){}fbPumpImages();}
var _pumping=false;
function fbPumpImages(){
  if(_pumping||!FB.connected||FB.paused||!FB.db||!IMGQ.length)return;
  _pumping=true;
  var k=IMGQ[0];
  var done=function(ok){
    if(ok||ok===null){IMGQ.shift();try{localStorage.setItem('ib_imgq',JSON.stringify(IMGQ));}catch(e){}}
    _pumping=false;syncBadge();
    if(ok!==false)setTimeout(fbPumpImages,60);else setTimeout(fbPumpImages,8000);
  };
  imgGet(k,function(d){
    if(!d)return done(null);
    var r='rooms/'+FB.room+'/';
    FB.db.ref(r+'bingo_images/'+k).set(d).then(function(){return FB.db.ref(r+'bingo_img_meta/'+k).set({n:d.length,u:now()});})
      .then(function(){done(true);}).catch(function(e){FB.err='Image upload: '+(e.message||e);done(false);});
  });
}
function fbFetchImage(k,cb){
  if(!FB.connected||!FB.db)return cb(null);
  FB.db.ref('rooms/'+FB.room+'/bingo_images/'+k).once('value').then(function(s){cb(s.val());}).catch(function(){cb(null);});
}
function fbDeleteImage(k){
  if(!k)return;delete IMG[k];idbDel('imgs',k);delete CUT[k];idbDel('cuts',k);
  var qi=IMGQ.indexOf(k);if(qi>=0){IMGQ.splice(qi,1);try{localStorage.setItem('ib_imgq',JSON.stringify(IMGQ));}catch(e){}}
  if(FB.connected&&FB.db){var r='rooms/'+FB.room+'/';FB.db.ref(r+'bingo_images/'+k).remove().catch(function(){});FB.db.ref(r+'bingo_img_meta/'+k).remove().catch(function(){});}
}
function syncBadge(){
  var el=$('sync-dot');if(!el)return;
  var h;
  if(!FB.connected)h='<span style="color:var(--inkFaint)">⚫ off</span>';
  else if(FB.paused)h='<span style="color:var(--warn)" title="Sync paused — tap to resume">⏸ paused</span>';
  else if(FB.err)h='<span style="color:var(--bad)" title="'+esc(FB.err)+'">🔴 failed ↻</span>';
  else if(_fbWT||FB.writing||_pumping||Object.keys(DIRTY).length||IMGQ.length)h='<span style="color:var(--warn)" title="Tap to pause sync">🟡 '+(IMGQ.length?IMGQ.length+' img':'syncing')+'</span>';
  else if(!FB.firstPull)h='<span style="color:var(--inkFaint)">⚫ waiting</span>';
  else{var ago=Math.round((now()-FB.lastOk)/1000);h='<span style="color:var(--good)" title="Tap to pause sync">🟢 '+(ago<60?ago+'s':ago<3600?Math.round(ago/60)+'m':Math.round(ago/3600)+'h')+'</span>';}
  el.innerHTML=h;
}
setInterval(syncBadge,30000);
setInterval(function(){if(FB.connected&&!FB.paused&&IMGQ.length&&!_pumping)fbPumpImages();},15000);

// ════════════ Backup (real file — doesn't depend on browser storage) ════════════
function exportBackup(withImages){
  var keys={};
  var d={_type:'spotted-backup',_v:1,_exported:new Date().toISOString()};
  COLLS.forEach(function(c){d[c]=S[c];});
  var finish=function(){
    d.images=withImages?keys:{};
    var blob=new Blob([JSON.stringify(d)],{type:'application/json'});
    var fn='spotted-backup-'+tod()+(withImages?'':'-noimg')+'.json';
    downloadBlob(blob,fn);
    toast('Saved '+fn+' → Downloads');
  };
  if(!withImages)return finish();
  idbAll('imgs',function(all){
    var used=usedImageKeys();
    used.forEach(function(k){if(all[k]||IMG[k])keys[k]=all[k]||IMG[k];});
    finish();
  });
}
function usedImageKeys(){var u={};vals(S.items).forEach(function(it){if(it.img)u[it.img]=1;if(it.orig)u[it.orig]=1;});vals(S.sightings).forEach(function(s){if(s.photo)u[s.photo]=1;});return Object.keys(u);}
function downloadBlob(blob,fn){
  // Android Chrome is happiest with a data: URL download
  if(/Android/i.test(navigator.userAgent)){var r=new FileReader();r.onloadend=function(){var a=document.createElement('a');a.href=r.result;a.download=fn;document.body.appendChild(a);a.click();a.remove();};r.readAsDataURL(blob);}
  else{var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},4000);}
}
function importFile(){
  var inp=$('file-json');inp.value='';
  inp.onchange=function(){
    var f=inp.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      var d;try{d=JSON.parse(r.result);}catch(e){return alert('Not valid JSON: '+e.message);}
      if(d._type==='spotted-backup')return importSpotted(d);
      if(d._type==='decade-journal-settings')return importJournalSettings(d);
      if(d._type==='spotted-settings')return importSettings(d);
      if(d.events||d.places||d.people)return importJournalData(d);
      alert('Unrecognised file. Expected a Spotted backup, Decade Journal settings, or Decade Journal backup.');
    };
    r.readAsText(f);
  };
  inp.click();
}
function importSpotted(d){
  var counts=COLLS.map(function(c){return Object.keys(d[c]||{}).length+' '+c;}).join(', ');
  var mode=prompt('Import Spotted backup\n'+counts+'\n'+Object.keys(d.images||{}).length+' images\n\nType MERGE (keep newest of each) or REPLACE (wipe local first):','MERGE');
  if(!mode)return;mode=mode.trim().toUpperCase();
  if(mode==='REPLACE'){COLLS.forEach(function(c){Object.keys(S[c]).forEach(function(id){dirty(c,id);});S[c]={};});}
  COLLS.forEach(function(c){var src=d[c]||{};Object.keys(src).forEach(function(id){var lv=S[c][id];if(!lv||(src[id].u||0)>=(lv.u||0)){S[c][id]=src[id];dirty(c,id);}});});
  Object.keys(d.images||{}).forEach(function(k){IMG[k]=d.images[k];idbPut('imgs',k,d.images[k]);imgQueueUpload(k);});
  sv();render();toast('Imported ✓');
}
function importJournalSettings(d){
  if(!d.fb_config&&d.gPlacesKey){L.gPlacesKey=d.gPlacesKey;svL();return toast('Google Places key imported');}
  if(!d.fb_config)return alert('That settings file has no Firebase config.');
  var room=prompt('Decade Journal Firebase config found ('+d.fb_config.databaseURL+').\n\nRoom for Spotted (data goes to rooms/<room>/bingo — separate from the journal):',d.fb_room||'');
  if(!room)return;
  if(d.gPlacesKey){L.gPlacesKey=d.gPlacesKey;svL();}
  localStorage.setItem('ib_fb_config',JSON.stringify(d.fb_config));
  fbInit(d.fb_config,room.trim());render();toast('Connected to room '+room+(d.gPlacesKey?' + Google Places key added':''));

// ── Classic remover: border-colour flood with gradient following + cleanup ──
function classicRemove(src,tol){
  tol=tol||38;
  return loadImage(src).then(function(img){
    var s=Math.min(1,900/Math.max(img.naturalWidth,img.naturalHeight));

    var refs=[];
    ring.forEach(function(p){var r=d[p*4],g=d[p*4+1],b=d[p*4+2];if(d[p*4+3]<30)return;
      for(var k=0;k<refs.length;k++){var R=refs[k];if(Math.abs(R[0]/R[3]-r)+Math.abs(R[1]/R[3]-g)+Math.abs(R[2]/R[3]-b)<60){R[0]+=r;R[1]+=g;R[2]+=b;R[3]++;return;}}
      refs.push([r,g,b,1]);});
    refs.sort(function(a,b){return b[3]-a[3];});
    var minCount=ring.length*0.08;
    refs=refs.filter(function(r,i){return i===0||r[3]>minCount;}).slice(0,4).map(function(r){return[r[0]/r[3],r[1]/r[3],r[2]/r[3]];});
    function dist(i,r){var dr=d[i]-r[0],dg=d[i+1]-r[1],db=d[i+2]-r[2];return Math.sqrt(dr*dr*0.3+dg*dg*0.59+db*db*0.11)*1.8;}

    var bg=new Uint8Array(N),q=new Int32Array(N),qh=0,qt=0;
    for(var e=0;e<ring.length;e++){var p=ring[e];if(!bg[p]&&(d[p*4+3]<30||nearRef(p*4))){bg[p]=1;q[qt++]=p;}}
    var step=tol*0.42;
    while(qh<qt){
      var p=q[qh++],px=p%W,py=(p/W)|0,pi=p*4;

      while(qh<qt){var p2=q[qh++];cnt++;var x2=p2%W,y2=(p2/W)|0;
        if(x2>0&&!bg[p2-1]&&!lab[p2-1]){lab[p2-1]=cur;q[qt++]=p2-1;}
        if(x2<W-1&&!bg[p2+1]&&!lab[p2+1]){lab[p2+1]=cur;q[qt++]=p2+1;}
        if(y2>0&&!bg[p2-W]&&!lab[p2-W]){lab[p2-W]=cur;q[qt++]=p2-W;}
        if(y2<H-1&&!bg[p2+W]&&!lab[p2+W]){lab[p2+W]=cur;q[qt++]=p2+W;}}

    var mc=document.createElement('canvas');mc.width=W;mc.height=H;var mx=mc.getContext('2d');var md=mx.createImageData(W,H);

    x.putImageData(id,0,0);
    return trimData(c.toDataURL('image/png'));
  });
}

var CUT={};

    if(CUT[job[0]]){job[2](CUT[job[0]]);continue;}
    _stBusy++;
    (function(job){setTimeout(function(){makeSticker(job[1],function(r){_stBusy--;if(r){CUT[job[0]]=r;idbPut('cuts',job[0],r);}job[2](r);_stRun();});},10);})(job);

function makeSticker(src,callback){
  var img=new Image();img.crossOrigin='anonymous';
  img.onload=function(){
    try{
      var ow=Math.min(img.naturalWidth||img.width,400);
      var oh=Math.round((img.naturalHeight||img.height)*(ow/(img.naturalWidth||img.width)));
      var EDGE=70,W=ow+EDGE*2,H=oh+EDGE*2;
      var c=document.createElement('canvas');c.width=W;c.height=H;
      var ctx=c.getContext('2d',{willReadFrequently:true});
      ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
      ctx.drawImage(img,EDGE,EDGE,ow,oh);
      var id=ctx.getImageData(0,0,W,H),d=id.data;
      // 1. flood fill background (transparent or near-white)
      var isBG=new Uint8Array(W*H),q=[],qi=0;
      for(var x=0;x<W;x++)q.push(x,0,x,H-1);
      for(var y=0;y<H;y++)q.push(0,y,W-1,y);
      while(qi<q.length){
        var sx=q[qi++],sy=q[qi++];
        if(sx<0||sx>=W||sy<0||sy>=H)continue;
        var si=sy*W+sx;if(isBG[si])continue;var pi=si*4;
        if(d[pi+3]<100){isBG[si]=1;q.push(sx-1,sy,sx+1,sy,sx,sy-1,sx,sy+1);continue;}
        if(d[pi]<240||d[pi+1]<240||d[pi+2]<240)continue;
        isBG[si]=1;q.push(sx-1,sy,sx+1,sy,sx,sy-1,sx,sy+1);
      }
      // 2. object mask
      var maskC=document.createElement('canvas');maskC.width=W;maskC.height=H;
      var mctx=maskC.getContext('2d'),mid2=mctx.createImageData(W,H),md=mid2.data;
      for(var i=0;i<W*H;i++){var v=isBG[i]?0:255;md[i*4]=md[i*4+1]=md[i*4+2]=v;md[i*4+3]=255;}
      mctx.putImageData(mid2,0,0);
      // 3. blur → outline shape
      var dashC=document.createElement('canvas');dashC.width=W;dashC.height=H;
      var dctx=dashC.getContext('2d');dctx.filter='blur(20px)';dctx.drawImage(maskC,0,0);dctx.filter='none';
      var dashBmp=dctx.getImageData(0,0,W,H).data;
      // 4. blur → outer clip
      var clipC=document.createElement('canvas');clipC.width=W;clipC.height=H;
      var cctx=clipC.getContext('2d');cctx.filter='blur(26px)';cctx.drawImage(maskC,0,0);cctx.filter='none';
      var clipBmp=cctx.getImageData(0,0,W,H).data;
      // 5. soft alpha falloff (white die-cut backing stays inside the clip)
      for(var i=0;i<W*H;i++){
        var v=clipBmp[i*4];
        if(v<8)d[i*4+3]=0;else if(v<20)d[i*4+3]=Math.round(d[i*4+3]*((v-8)/12));
      }
      ctx.putImageData(id,0,0);
      // 6. radial sweep for outline
      var cx2=0,cy2=0,cnt=0;
      for(var y=0;y<H;y++)for(var x=0;x<W;x++)if(!isBG[y*W+x]){cx2+=x;cy2+=y;cnt++;}
      if(cnt===0){callback(null);return;}
      cx2=Math.round(cx2/cnt);cy2=Math.round(cy2/cnt);
      var maxR=Math.max(W,H),rawPts=[];
      for(var deg=0;deg<360;deg++){
        var rad=deg*Math.PI/180,dx2=Math.cos(rad),dy2=Math.sin(rad),hitX=cx2,hitY=cy2;
        for(var r=0;r<maxR;r++){
          var px=Math.round(cx2+dx2*r),py=Math.round(cy2+dy2*r);
          if(px<0||px>=W||py<0||py>=H){hitX=px;hitY=py;break;}
          if(dashBmp[(py*W+px)*4]<=15){hitX=px;hitY=py;break;}
        }
        rawPts.push([hitX,hitY]);
      }
      // 7. smooth
      var pts=rawPts;
      for(var pass=0;pass<3;pass++){var sm=[];for(var i=0;i<pts.length;i++){var ax=0,ay=0,nn=0;for(var j=-7;j<=7;j++){var idx=(i+j+pts.length)%pts.length;ax+=pts[idx][0];ay+=pts[idx][1];nn++;}sm.push([ax/nn,ay/nn]);}pts=sm;}
      // 8. subsample
      var fp=[];for(var i=0;i<pts.length;i+=5)fp.push(pts[i]);
      // 9. draw
      var out=document.createElement('canvas');out.width=W;out.height=H;
      var fctx=out.getContext('2d');fctx.drawImage(c,0,0);
      fctx.strokeStyle='#000';fctx.lineWidth=3;fctx.setLineDash([14,10]);fctx.lineCap='round';fctx.lineJoin='round';
      fctx.beginPath();var np=fp.length;
      fctx.moveTo((fp[np-1][0]+fp[0][0])/2,(fp[np-1][1]+fp[0][1])/2);
      for(var i=0;i<np;i++){var cu=fp[i],nx=fp[(i+1)%np];fctx.quadraticCurveTo(cu[0],cu[1],(cu[0]+nx[0])/2,(cu[1]+nx[1])/2);}
      fctx.closePath();fctx.stroke();
      callback(out.toDataURL('image/png'));
    }catch(e){console.warn('sticker',e);callback(null);}
  };
  img.onerror=function(){callback(null);};
  img.src=src;
}

    var pos=function(e){var r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];};
    cv.addEventListener('pointerdown',function(e){e.preventDefault();cv.setPointerCapture(e.pointerId);var p=pos(e);tePush();
      if(TE.mode==='wand'){teWand(p[0]|0,p[1]|0);}else{TE.drawing=true;TE.last=p;teBrush(p,p);}});
    cv.addEventListener('pointermove',function(e){if(!TE||!TE.drawing)return;var p=pos(e);teBrush(TE.last,p);TE.last=p;});
    var up=function(){if(TE)TE.drawing=false;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  });
}
function teMode(m){TE.mode=m;document.querySelectorAll('#te-modes button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-m')===m);});
  var sl=$('te-sl'),lb=$('te-lbl');if(m==='wand'){lb.textContent='Tolerance';sl.min=4;sl.max=90;sl.value=TE.tol;}else{lb.textContent='Brush';sl.min=6;sl.max=90;sl.value=TE.size;}}
function teSlide(v){if(TE.mode==='wand')TE.tol=+v;else TE.size=+v;}
function tePush(){TE.undo.push(TE.ctx.getImageData(0,0,TE.W,TE.H));if(TE.undo.length>15)TE.undo.shift();}
function teUndo(){var u=TE.undo.pop();if(u)TE.ctx.putImageData(u,0,0);}
function teBrush(a,b){
  var x=TE.ctx;x.save();x.lineCap='round';x.lineJoin='round';x.lineWidth=TE.size;
  if(TE.mode==='erase'){x.globalCompositeOperation='destination-out';x.strokeStyle='#000';x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke();}
  else{// restore: clip a stroke path, paint base through it
    x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);
    var tmp=document.createElement('canvas');tmp.width=TE.W;tmp.height=TE.H;var t=tmp.getContext('2d');
    t.lineCap='round';t.lineWidth=TE.size;t.strokeStyle='#000';t.beginPath();t.moveTo(a[0],a[1]);t.lineTo(b[0],b[1]);t.stroke();
    t.globalCompositeOperation='source-in';t.drawImage(TE.base,0,0);
    x.globalCompositeOperation='source-over';x.drawImage(tmp,0,0);}
  x.restore();
}
function teWand(sx,sy){
  var W=TE.W,H=TE.H,id=TE.ctx.getImageData(0,0,W,H),d=id.data,si=(sy*W+sx)*4;
  if(d[si+3]<10)return;
  var r0=d[si],g0=d[si+1],b0=d[si+2],tol=TE.tol,seen=new Uint8Array(W*H),q=[sy*W+sx],qi=0;seen[sy*W+sx]=1;
  while(qi<q.length){var p=q[qi++],i=p*4;
    var dr=d[i]-r0,dg=d[i+1]-g0,db=d[i+2]-b0;
    if(d[i+3]<10||Math.sqrt(dr*dr*0.3+dg*dg*0.59+db*db*0.11)*1.8>tol)continue;
    d[i+3]=0;var x=p%W,y=(p/W)|0;
    if(x>0&&!seen[p-1]){seen[p-1]=1;q.push(p-1);}if(x<W-1&&!seen[p+1]){seen[p+1]=1;q.push(p+1);}
    if(y>0&&!seen[p-W]){seen[p-W]=1;q.push(p-W);}if(y<H-1&&!seen[p+W]){seen[p+W]=1;q.push(p+W);}}
  TE.ctx.putImageData(id,0,0);
}
function teDone(){var d=TE.cv.toDataURL('image/png'),cb=TE.onDone;TE=null;closeModal(3);trimData(d).then(cb);}

// ── Photo intake (camera / gallery / URL / paste / Android share target) ──
function pickPhoto(kind,cb){
  if(kind==='cam'||kind==='gal'){
    var inp=$(kind==='cam'?'file-cam':'file-gal');inp.value='';
    inp.onchange=function(){var f=inp.files[0];if(f)fileToData(f).then(cb).catch(function(e){alert(e.message);});};
    inp.click();
  }else if(kind==='url'){
    var u=prompt('Paste an image URL (long-press an image → Copy image address):');
    if(u)urlToData(u).then(cb).catch(function(e){alert('Could not load that image ('+e.message+').\nTip: long-press the image → Share → Spotted, or save it and use Gallery.');});
  }else if(kind==='paste'){
    if(!navigator.clipboard||!navigator.clipboard.read){return alert('Clipboard images not supported here — use Gallery or URL.');}
    navigator.clipboard.read().then(function(items){
      for(var i=0;i<items.length;i++){var t=items[i].types.find(function(x){return x.indexOf('image/')===0;});
        if(t)return items[i].getType(t).then(blobToDataURL).then(function(d){return resizeData(d,1600,'jpeg',0.9);}).then(cb);}
      return navigator.clipboard.readText().then(function(txt){if(/^https?:\/\//.test(txt||''))return urlToData(txt).then(cb);alert('No image on the clipboard.');});
    }).catch(function(e){alert('Clipboard read blocked: '+e.message);});
  }
}
// Images shared into the app via Android share sheet (manifest share_target → sw.js stashes in Cache)
function checkSharedImage(){
  if(location.search.indexOf('shared=1')<0||!('caches' in window))return;
  history.replaceState(null,'',location.pathname);
  caches.open('ib-share').then(function(c){
    return c.match('shared-image').then(function(r){
      if(r)return r.blob().then(function(b){c.delete('shared-image');return blobToDataURL(b);}).then(function(d){return resizeData(d,1600,'jpeg',0.9);}).then(function(d){openItemModal(null,{photo:d});});
      return c.match('shared-url').then(function(r2){
        if(!r2)return;
        return r2.text().then(function(t){c.delete('shared-url');var m=String(t).match(/https?:\/\/\S+/);if(!m)return;
          toast('Loading shared image…');
          urlToData(m[0]).then(function(d){openItemModal(null,{photo:d});}).catch(function(){openItemModal(null,{});toast('That link isn\'t a direct image — long-press the picture itself → Share',5000);});});
      });
    });
  });
}

function studioPaint(){
  if(!IM)return;var v=IM.vers[IM.cur],el=$('st-img');
  var src=function(x,cb){if(x.d)return cb(x.d);imgGet(x.k,cb);};
  if(v&&el){if(IM.stickerPrev&&IM.stickerPrev.i===IM.cur&&IM.stickerPrev.d)el.src=IM.stickerPrev.d;else src(v,function(d){if(d)el.src=d;});}
  document.querySelectorAll('img[data-vi]').forEach(function(im){var x=IM.vers[+im.getAttribute('data-vi')];if(x)src(x,function(d){if(d)im.src=d;});});
}
function studioCur(cb){var v=IM&&IM.vers[IM.cur];if(!v)return cb(null);if(v.d)return cb(v.d);imgGet(v.k,cb);}
function studioOrig(cb){var o=IM.vers.find(function(x){return x.label==='Photo'||x.label==='Original';})||IM.vers[IM.cur];if(o.d)return cb(o.d);imgGet(o.k,cb);}
function studioAdd(d,label,isSource){
  if(!IM)return;
  IM.vers.push({d:d,label:label,src:!!isSource});IM.cur=IM.vers.length-1;IM.stickerPrev=null;rItem();
  if(isSource&&L.autoProcess&&L.autoProcess!=='none')setTimeout(function(){studioRun(L.autoProcess);},50);
}
function studioPick(kind){_imCap();pickPhoto(kind,function(d){studioAdd(d,'Photo',true);});}
function studioBusy(msg){if(!IM)return;IM.busy=msg;var b=$('st-busy');if(b&&msg){b.textContent=msg;return;}rItem();}
function studioRun(kind){
  _imCap();
  studioCur(function(src){
    if(!src)return;
    var p;
    if(kind==='quick'){studioBusy('Removing background…');p=classicRemove(src).then(function(d){return[d,'Quick cut'];});}
    else if(kind==='ai'){studioBusy('Loading on-device AI…');p=aiRemove(src,studioBusy).then(function(d){return[d,'AI cut'];})
      .catch(function(e){console.warn(e);toast('On-device AI unavailable ('+(e.message||e)+'). Used quick remover.',5000);return classicRemove(src).then(function(d){return[d,'Quick cut'];});});}
    else if(kind==='shot'){
      var hasKey=(L.aiProvider==='openai'?L.openaiKey:L.geminiKey);
      if(!hasKey){if(confirm('No AI key yet.\n\nOK = open Settings → AI to add a Gemini or OpenAI key\nCancel = send the photo + prompt to an AI app instead')){openSettings('ai');}else studioShare();return;}
      // product shots work best from the untouched photo
      p=new Promise(function(res){studioOrig(res);}).then(function(o){studioBusy('Starting…');return aiProductShot(o,productPrompt($('im-name')?$('im-name').value:IM.f.name,IM.f.cat),studioBusy);}).then(function(d){return[d,'AI shot'];});
    }
    p.then(function(r){IM.busy=null;studioAdd(r[0],r[1]);}).catch(function(e){IM.busy=null;rItem();
      if(e&&e.friendly){if(confirm('⚠️ '+e.friendly+'\n\nOK = send the photo + prompt to the Gemini app instead (free)\nCancel = close'))studioShare();return;}
      alert('⚠️ '+(e.message||e));});
  });
}
function studioTouch(){_imCap();studioCur(function(src){if(src)openTouchUp(src,function(d){studioAdd(d,'Touch-up');});});}
function studioShare(){_imCap();studioOrig(function(src){if(src)shareToAIApp(src,productPrompt(IM.f.name,IM.f.cat));});}
function studioSticker(){
  if(IM.stickerPrev&&IM.stickerPrev.i===IM.cur){IM.stickerPrev=null;return rItem();}
  studioCur(function(src){makeSticker(src,function(s){if(!s)return toast('Sticker failed');IM.stickerPrev={i:IM.cur,d:s};IM.prevWhite=false;rItem();});});
}
function saveItem(){
  _imCap();
  var f=IM.f;
  if(!f.name.trim()){var n=$('im-name');if(n){n.focus();n.style.borderColor='var(--bad)';}return toast('Give it a name');}
  f.name=f.name.trim();
  var v=IM.vers[IM.cur];
  var oldImg=IM.isNew?null:S.items[IM.id].img,oldOrig=IM.isNew?null:S.items[IM.id].orig;
  var finish=function(){
    if(IM.isNew)f.created=now();
    put('items',f);
    // drop images no longer referenced
    [oldImg,oldOrig].forEach(function(k){if(k&&k!==f.img&&k!==f.orig)fbDeleteImage(k);});
    var ctx=IM.ctx,first=IM.isNew&&IM.logFirst?IM.first:null;
    closeModal(1);
    if(first){var s=addSighting({item:f.id,date:first.date,by:first.by.slice(),place:first.place,note:first.note,card:ctx&&ctx.card});if(first.place){L.lastPlace=first.place;svL();}if(ctx)fulfilCell(ctx.card,ctx.cell,f.id,s);}
    else if(ctx){var s2=addSighting({item:f.id,date:tod(),by:[L.me],place:'',card:ctx.card});fulfilCell(ctx.card,ctx.cell,f.id,s2);}
    render();toast(IM&&IM.isNew?'Saved':'Saved ✓');
  };
  if(!v){f.img=f.img||'';return finish();}
  var srcV=IM.vers.find(function(x){return x.src;})||null;
  var tasks=[];
  if(v.k)f.img=v.k;else tasks.push(resizeData(v.d,800,'webp',0.88).then(function(d){f.img=imgSave(d);}));
  // keep the untouched photo as "orig" (small) so you can redo the clean-up later
  if(srcV&&srcV!==v&&srcV.d)tasks.push(resizeData(srcV.d,1000,'jpeg',0.82).then(function(d){f.orig=imgSave(d);}));
  else if(!srcV&&IM.vers.some(function(x){return x.k&&x.k===oldOrig;}))f.orig=oldOrig;
  else if(srcV===v)f.orig='';
  Promise.all(tasks).then(finish).catch(function(e){alert('Save failed: '+e.message);});
}
function deleteItem(){
  var it=S.items[IM.id];if(!it)return;var ss=itemSightings(it.id);
  if(!confirm('Delete "'+it.name+'" and its '+ss.length+' sighting(s)?'))return;
  deleteItemById(it.id);closeModal(1);render();

function deleteItemById(id){
  var it=S.items[id];if(!it)return;
  itemSightings(id).forEach(function(s){if(s.photo)fbDeleteImage(s.photo);del('sightings',s.id);});
  vals(S.cards).forEach(function(c){var ch=false;(c.cells||[]).forEach(function(cell){if(cell.ref===id&&cell.t==='item'){cell.t='empty';cell.ref='';ch=true;}});if(ch)put('cards',c);});
  vals(S.stamps).forEach(function(st){if(st.item===id)del('stamps',st.id);});
  fbDeleteImage(it.img);fbDeleteImage(it.orig);del('items',id);
}

function saveSighting(){
  _smCap();var f=SM.f,ctx=SM.ctx,wasNew=SM.isNew,old=wasNew?null:S.sightings[f.id];
  if(!f.by.length)f.by=[L.me];

// ════════════ PLACES ════════════
// Search order: your Spotted places + Decade Journal places (instant) → Google Places (if key) → Photon → Nominatim
var PP=null;
function djStore(){try{return JSON.parse(localStorage.getItem('bujo3')||'null')||{};}catch(e){return{};}}
function gKey(){return L.gPlacesKey||djStore().gPlacesKey||'';}
function djPlaces(){return(djStore().places||[]).filter(function(p){return p&&p.name&&p.address!=='Online';});}
function openPlacePicker(cb){
  PP={cb:cb,results:null,local:[],q:'',loading:false,loc:L.lastLoc||null};rPlaces();
  setTimeout(function(){var q=$('pp-q');if(q)q.focus();},80);
}
function rPlaces(){
  var h='<div class="mo-h"><h3>📍 Where?</h3><button class="icon-btn" onclick="closeModal(3)">✕</button></div><div class="mo-b">';
  h+='<div class="row"><input class="m-in" id="pp-q" placeholder="Store, mall, park, city…" value="'+esc(PP.q)+'" autocomplete="off" oninput="ppType(this.value)" onkeydown="if(event.key===\'Enter\')ppSearch()"><button class="btn btn-p" onclick="ppSearch()">🔍</button></div>';
  h+='<div class="row" style="margin-top:6px"><button class="btn btn-s" style="flex:1" onclick="ppNear()">📍 Near me</button><button class="btn btn-s" style="flex:1" onclick="ppCustom()">✍️ Use typed name</button></div>';
  h+='<div class="hint" style="margin-top:4px">'+(gKey()?'Searching with Google Places'+(L.gPlacesKey?'':' (key from Decade Journal)'):'Free map search (OpenStreetMap). Add a Google Places key in ⚙️ Settings for much better store results.')+(PP.loc?' · near your last location':'')+'</div>';
  h+='<div id="pp-res">'+ppResHTML()+'</div></div>';
  openModal(h,3);
}
function ppResHTML(){
  var h='';
  if(PP.local.length)h+='<div class="m-lbl">Saved places</div>'+PP.local.map(function(r,i){return'<div class="li" onclick="ppChooseLocal('+i+')"><div class="thumb">'+(r.dj?'📓':'⭐')+'</div><div class="grow"><div class="t">'+esc(r.name)+'</div><div class="s">'+esc(r.address||'')+(r.dj?' · from Decade Journal':'')+'</div></div></div>';}).join('');
  if(PP.loading)h+='<div class="m-lbl">Searching…</div><div class="spin" style="margin:8px auto"></div>';
  else if(PP.results){h+='<div class="m-lbl">'+(PP.src||'Results')+'</div>';h+=PP.results.length?PP.results.map(function(r,i){return'<div class="li" onclick="ppChooseResult('+i+')"><div class="thumb">📍</div><div class="grow"><div class="t">'+esc(r.name)+'</div><div class="s">'+esc(r.address||'')+(r.dist!=null?' · '+r.dist:'')+'</div></div></div>';}).join(''):'<div class="hint" style="padding:6px 0">No map results — tap ✍️ Use typed name to save it as is.</div>';}
  if(!PP.q&&!PP.results){
    var used={};vals(S.sightings).forEach(function(x){if(x.place)used[x.place]=(used[x.place]||0)+1;});
    var recent=vals(S.places).sort(function(a,b){return(used[b.id]||0)-(used[a.id]||0)||(b.u||0)-(a.u||0);});
    if(recent.length)h+='<div class="m-lbl">Your places</div>'+recent.slice(0,40).map(function(p){return'<div class="li"><div class="grow" onclick="ppChoose(\''+p.id+'\')"><div class="t">'+esc(p.name)+'</div><div class="s">'+esc(p.address||'')+(used[p.id]?' · '+used[p.id]+'×':'')+'</div></div><button class="btn btn-g btn-sm" onclick="ppDelete(\''+p.id+'\')">✕</button></div>';}).join('');
    else if(djPlaces().length)h+='<div class="hint" style="margin-top:10px">Type to search your '+djPlaces().length+' Decade Journal places too.</div>';
  }
  return h;
}
function ppPaint(){var el=$('pp-res');if(el)el.innerHTML=ppResHTML();}
function ppType(v){
  PP.q=v;var q=v.trim().toLowerCase();
  // instant local matches
  var seen={},out=[];
  vals(S.places).forEach(function(p){if(q&&p.name.toLowerCase().indexOf(q)>=0){seen[p.name.toLowerCase()+'|'+(p.address||'')]=1;out.push({id:p.id,name:p.name,address:p.address});}});
  if(q)djPlaces().forEach(function(p){var k=p.name.toLowerCase()+'|'+(p.address||'');if(!seen[k]&&p.name.toLowerCase().indexOf(q)>=0){seen[k]=1;out.push({dj:1,name:p.name,address:p.address||'',lat:p.lat,lng:p.lng});}});
  PP.local=out.slice(0,12);
  if(!q){PP.results=null;PP.loading=false;}
  ppPaint();
  if(q.length>=3)debounce('ppsearch',ppSearch,500);
}
function ppChoose(id){var cb=PP.cb;closeModal(3);PP=null;cb(id);}
function ppDelete(id){if(vals(S.sightings).some(function(x){return x.place===id;})&&!confirm('This place is used by sightings. Delete anyway?'))return;del('places',id);ppPaint();}
function ppCustom(){var q=(($('pp-q')||{}).value||'').trim();if(!q){q=prompt('Place name:');if(!q)return;}
  var ex=vals(S.places).find(function(p){return p.name.toLowerCase()===q.toLowerCase();});if(ex)return ppChoose(ex.id);
  var p=put('places',{id:'pl_'+gid(),name:q,address:'',lat:PP.loc?PP.loc.lat:null,lng:PP.loc?PP.loc.lng:null});ppChoose(p.id);}
function ppChooseLocal(i){var r=PP.local[i];if(r.id)return ppChoose(r.id);ppSave(r);}
function ppChooseResult(i){var r=PP.results[i];if(r.id)return ppChoose(r.id);ppSave(r);}
function ppSave(r){
  var ex=vals(S.places).find(function(p){return p.name.toLowerCase()===r.name.toLowerCase()&&(p.address||'')===(r.address||'');});if(ex)return ppChoose(ex.id);
  var p=put('places',{id:'pl_'+gid(),name:r.name,address:r.address||'',lat:r.lat||null,lng:r.lng||null});ppChoose(p.id);
}
function _miles(a,b,c,d){if(!a||!c)return null;var R=3958.8,r=Math.PI/180,x=Math.sin((c-a)*r/2),y=Math.sin((d-b)*r/2);var m=2*R*Math.asin(Math.sqrt(x*x+Math.cos(a*r)*Math.cos(c*r)*y*y));return m<0.1?Math.round(m*5280)+' ft':m.toFixed(1)+' mi';}
function _withDist(list){if(!PP.loc)return list;list.forEach(function(r){r.dist=_miles(PP.loc.lat,PP.loc.lng,r.lat,r.lng);});return list;}
// Google Places (New) — same API + key format as Decade Journal
function _gSearch(q,cb){
  var body={textQuery:q,maxResultCount:10};
  if(PP.loc)body.locationBias={circle:{center:{latitude:PP.loc.lat,longitude:PP.loc.lng},radius:15000}};
  fetch('https://places.googleapis.com/v1/places:searchText',{method:'POST',headers:{'Content-Type':'application/json','X-Goog-Api-Key':gKey(),'X-Goog-FieldMask':'places.displayName,places.formattedAddress,places.location'},body:JSON.stringify(body)})
  .then(function(r){return r.json();}).then(function(d){if(d.error)throw new Error(d.error.message);cb(null,(d.places||[]).map(_gMap));}).catch(function(e){cb(e);});
}
function _gNearby(cb){
  fetch('https://places.googleapis.com/v1/places:searchNearby',{method:'POST',headers:{'Content-Type':'application/json','X-Goog-Api-Key':gKey(),'X-Goog-FieldMask':'places.displayName,places.formattedAddress,places.location'},
    body:JSON.stringify({maxResultCount:15,rankPreference:'DISTANCE',locationRestriction:{circle:{center:{latitude:PP.loc.lat,longitude:PP.loc.lng},radius:300}}})})
  .then(function(r){return r.json();}).then(function(d){if(d.error)throw new Error(d.error.message);cb(null,(d.places||[]).map(_gMap));}).catch(function(e){cb(e);});
}
function _gMap(p){return{name:(p.displayName||{}).text||'',address:p.formattedAddress||'',lat:p.location?p.location.latitude:null,lng:p.location?p.location.longitude:null};}
// Photon (OpenStreetMap, much better than Nominatim for shops/POIs, supports location bias)
function _photonMap(f){var pr=f.properties||{},c=(f.geometry||{}).coordinates||[];
  var addr=[pr.housenumber&&pr.street?pr.housenumber+' '+pr.street:pr.street,pr.city||pr.town||pr.village||pr.district,pr.state].filter(Boolean).join(', ');
  return{name:pr.name||pr.street||'',address:addr,lat:c[1],lng:c[0]};}
function _osmSearch(q,cb){
  var u='https://photon.komoot.io/api/?limit=10&lang=en&q='+encodeURIComponent(q)+(PP.loc?'&lat='+PP.loc.lat+'&lon='+PP.loc.lng:'');
  fetch(u).then(function(r){return r.json();}).then(function(j){var res=(j.features||[]).map(_photonMap).filter(function(r){return r.name;});
    if(res.length)return cb(null,res);
    var n='https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=8&q='+encodeURIComponent(q)+(PP.loc?'&viewbox='+(PP.loc.lng-0.3)+','+(PP.loc.lat+0.3)+','+(PP.loc.lng+0.3)+','+(PP.loc.lat-0.3):'');
    return fetch(n).then(function(r){return r.json();}).then(function(j2){cb(null,j2.map(_nomName));});
  }).catch(function(e){cb(e);});
}
function _nomName(r){var a=r.address||{};var nm=r.name||a.shop||a.amenity||a.building||a.tourism||a.leisure||a.road||String(r.display_name||'').split(',')[0];
  var addr=[a.house_number&&a.road?a.house_number+' '+a.road:a.road,a.city||a.town||a.village||a.suburb,a.state].filter(Boolean).join(', ');return{name:nm,address:addr||r.display_name,lat:+r.lat,lng:+r.lon};}
function ppSearch(){
  var q=(($('pp-q')||{}).value||'').trim();PP.q=q;if(!q)return;
  var myQ=q;PP.loading=true;ppPaint();
  var done=function(src){return function(e,res){if(!PP||PP.q!==myQ)return;
    if(e&&src==='Google'){console.warn('Google Places failed, using OSM',e);toast('Google Places error: '+(e.message||e)+' — using free map search',4000);return _osmSearch(myQ,done('Map results'));}
    PP.loading=false;PP.src=src==='Google'?'Google results':'Map results';PP.results=e?[]:_withDist(res);if(e)toast('Search failed: '+(e.message||e));ppPaint();};};
  if(gKey())_gSearch(q,done('Google'));else _osmSearch(q,done('Map results'));
}
function ppNear(){
  if(!navigator.geolocation)return alert('No GPS available');
  toast('Getting location…');
  navigator.geolocation.getCurrentPosition(function(pos){
    var la=pos.coords.latitude,lo=pos.coords.longitude;PP.loc={lat:la,lng:lo};L.lastLoc={lat:la,lng:lo};svL();
    if((($('pp-q')||{}).value||'').trim())return ppSearch();
    PP.loading=true;PP.q='';ppPaint();
    var finish=function(list,src){
      vals(S.places).filter(function(p){return p.lat&&Math.abs(p.lat-la)<0.005&&Math.abs(p.lng-lo)<0.005;}).forEach(function(p){list.unshift({id:p.id,name:p.name,address:(p.address||'')+' (saved)',lat:p.lat,lng:p.lng});});
      PP.loading=false;PP.src=src;PP.results=_withDist(list);ppPaint();
    };
    if(gKey())_gNearby(function(e,res){if(!e&&res.length)return finish(res,'Nearby (Google)');osmNear();});else osmNear();
    function osmNear(){
      fetch('https://photon.komoot.io/reverse?limit=10&radius=0.3&lat='+la+'&lon='+lo).then(function(r){return r.json();})
      .then(function(j){var seen={};finish((j.features||[]).map(_photonMap).filter(function(r){if(!r.name||seen[r.name])return false;seen[r.name]=1;return true;}),'Nearby');})
      .catch(function(){finish([],'Nearby');});
    }
  },function(e){alert('Location error: '+e.message);},{enableHighAccuracy:true,timeout:12000});
}

// ════════════════════════════════════════════════════════════════
//  BINGO
//  card: {id,name,size,free,mode:'team'|'race',cells:[{t:'item'|'cat'|'text'|'free'|'empty',ref,text,lock}],pool,created,u}
//  stamps live in their own collection so two phones stamping at once never overwrite each other:
//    team: stamps[cardId_i]          race: stamps[cardId_i_personId]
//    {id,card,cell,pid,d,by:[],sid,item}
// ════════════════════════════════════════════════════════════════
var CV={};// per-card "viewing whose card" in race mode
function lettersFor(n){return n===5?['B','I','N','G','O']:n===4?['B','I','N','G']:['B','I','N'];}
function isRace(c){return c&&c.mode==='race';}
function stampKey(c,i,pid){return isRace(c)?c.id+'_'+i+'_'+pid:c.id+'_'+i;}
function getStamp(c,i,pid){return S.stamps[stampKey(c,i,pid)]||null;}
function cardStamps(c){return vals(S.stamps).filter(function(s){return s.card===c.id;});}
function cellDoneFor(c,i,pid){var x=c.cells[i];return !!x&&(x.t==='free'||!!getStamp(c,i,pid));}
function cellStampedAny(c,i){return cardStamps(c).some(function(s){return s.cell===i;});}
function viewerOf(c){return isRace(c)?(CV[c.id]&&S.people[CV[c.id]]?CV[c.id]:L.me):'';}
function bingoLines(c,pid){
  var n=c.size,L2=[],r,i;
  for(r=0;r<n;r++){var row=[],col=[];for(i=0;i<n;i++){row.push(r*n+i);col.push(i*n+r);}L2.push(row,col);}
  var d1=[],d2=[];for(i=0;i<n;i++){d1.push(i*n+i);d2.push(i*n+(n-1-i));}L2.push(d1,d2);
  return L2.filter(function(l){return l.every(function(ix){return cellDoneFor(c,ix,pid);});});
}
function racePlayers(c){var p={};p[L.me]=1;cardStamps(c).forEach(function(s){if(s.pid)p[s.pid]=1;});return Object.keys(p).filter(function(x){return S.people[x];});}
// one-time migration from v1.0–1.2 cards (stamps stored inside cells)
function migrateStamps(){
  vals(S.cards).forEach(function(c){var ch=false;
    (c.cells||[]).forEach(function(x,i){if(x&&x.done){var id=c.id+'_'+i;if(!S.stamps[id])put('stamps',{id:id,card:c.id,cell:i,pid:'',d:x.done.d,by:x.done.by||[],sid:x.done.sid||'',item:x.done.item||''});delete x.done;ch=true;}});
    if(!c.mode){c.mode='team';ch=true;}
    if(ch)put('cards',c);});
}
function viewBingo(){
  var cards=vals(S.cards).sort(function(a,b){return(b.created||0)-(a.created||0);});
  var act=L.activeCard&&S.cards[L.activeCard]?S.cards[L.activeCard]:null;
  if(act)return viewCard(act);
  var h='<div class="row" style="margin-bottom:10px"><h2 style="flex:1;font-size:20px">Bingo cards</h2><button class="btn btn-p" onclick="openCardMaker()">＋ New card</button></div>';
  if(!cards.length)return h+'<div class="empty"><div class="big">🎱</div><b>No cards yet.</b><br>Make a card from your categories or your own squares.<br><b>Team</b> cards are filled in together; <b>Race</b> cards give each of you your own stamps on the same squares.</div>';
  h+='<div class="card-list">'+cards.map(function(c){
    var n=c.size,pid=isRace(c)?L.me:'';
    var done=c.cells.filter(function(x,i){return cellDoneFor(c,i,pid);}).length,lines=bingoLines(c,pid).length;
    return'<div class="card-tile" onclick="L.activeCard=\''+c.id+'\';svL();render()"><div class="mini" style="grid-template-columns:repeat('+n+',minmax(0,1fr))">'+c.cells.map(function(x,i){return'<i class="'+(x.t==='free'?'f':cellDoneFor(c,i,pid)?'d':'')+'"></i>';}).join('')+'</div>'+
      '<div class="grow" style="flex:1;min-width:0"><div style="font-weight:700;font-size:15px">'+esc(c.name)+'</div><div class="hint">'+(isRace(c)?'🏁 Race':'👫 Team')+' · '+n+'×'+n+' · '+done+'/'+(n*n)+(isRace(c)?' yours':' stamped')+(lines?' · <b style="color:#d97706">'+lines+' BINGO'+(lines>1?'S':'')+'</b>':'')+'</div></div><span style="font-size:20px">›</span></div>';
  }).join('')+'</div>';
  return h;
}
function cellInner(c,i,card,pid){
  if(c.t==='free')return'<div class="bic">⭐</div><div class="bl">FREE</div>';
  var st=card?getStamp(card,i,pid):null;
  var itemId=st&&st.item?st.item:(c.t==='item'?c.ref:'');
  var it=itemId&&S.items[itemId];
  var h='';
  if(c.t==='cat')h+='<span class="kind">any</span>';
  if(c.t==='text')h+='<span class="kind">✍️</span>';
  if(c.lock&&!card)h+='<span class="lock">🔒</span>';
  if(it&&it.img)h+=imgHTML(it.img,'',L.sticker?'data-st':'');
  else if(c.t==='cat'){var k2=cat(c.ref);h+='<div class="bic">'+(k2?k2.icon:'❔')+'</div>';}
  else if(c.t==='item'&&it){var k3=cat(it.cat);h+='<div class="bic">'+(k3?k3.icon:'📦')+'</div>';}
  else if(c.t==='text')h+='<div class="bic">🔎</div>';
  else if(c.t==='empty')h+='<div class="bic" style="opacity:.4">＋</div>';
  var label=it?it.name:c.t==='cat'?(cat(c.ref)||{name:'?'}).name:c.t==='text'?c.text:'';
  if(label)h+='<div class="bl">'+esc(label)+'</div>';
  if(st){var p=person(isRace(card)?pid:(st.by||[])[0]);h+='<div class="stamp" style="background:'+(p?p.color:'#f59e0b')+'"></div><div class="by">'+(st.by||[]).map(function(x){return pdot(x,1);}).join('')+'</div>';}
  if(card&&isRace(card)){var others=cardStamps(card).filter(function(s){return s.cell===i&&s.pid!==pid;});
    if(others.length)h+='<div class="others">'+others.map(function(s){return pdot(s.pid,1);}).join('')+'</div>';}
  return h;
}
function viewCard(c){
  var n=c.size,pid=viewerOf(c),race=isRace(c),lines=bingoLines(c,pid),win={};lines.forEach(function(l){l.forEach(function(i){win[i]=1;});});
  var h='<div class="row" style="margin-bottom:4px"><button class="btn btn-s btn-sm" onclick="L.activeCard=\'\';svL();render()">‹ Cards</button><div class="spacer"></div>'+
    '<button class="btn btn-s btn-sm" onclick="openCardMaker(\''+c.id+'\')">✏️ Edit</button><button class="btn btn-s btn-sm" onclick="cardMenu(\''+c.id+'\')">⋯</button></div>';
  h+='<div class="bingo-wrap size-'+n+'"><div class="bingo-title">'+esc(c.name)+'</div>';
  h+='<div class="hint" style="text-align:center">'+(race?'🏁 Race — everyone stamps their own squares':'👫 Team card — anyone\'s find counts')+'</div>';
  if(race){
    h+='<div class="score">'+racePlayers(c).map(function(p){var pp=person(p),cnt=c.cells.filter(function(x,i){return x.t!=='free'&&!!getStamp(c,i,p);}).length,bl=bingoLines(c,p).length;
      return'<button class="chip'+(p===pid?' on':'')+'" onclick="CV[\''+c.id+'\']=\''+p+'\';render()">'+pdot(p,1)+esc(pp.name)+(p===L.me?' (me)':'')+' · '+cnt+(bl?' · 🎉'+bl:'')+'</button>';}).join('')+'</div>';
    if(pid!==L.me)h+='<div class="hint" style="text-align:center;color:var(--warn)">Peeking at '+esc(person(pid).name)+'\'s card — tap your name to stamp</div>';
  }
  if(lines.length)h+='<div class="bingo-banner">BINGO'+(lines.length>1?' ×'+lines.length:'')+'!</div>';
  h+='<div class="bingo-letters" style="grid-template-columns:repeat('+n+',minmax(0,1fr));padding:0 9px">'+lettersFor(n).map(function(x){return'<b>'+x+'</b>';}).join('')+'</div>';
  h+='<div class="bingo" style="grid-template-columns:repeat('+n+',minmax(0,1fr))">'+c.cells.map(function(cell,i){var d=!!getStamp(c,i,pid);
    return'<div class="bc'+(cell.t==='free'?' free':'')+(cell.t==='empty'?' empty':'')+(d?' done':'')+(win[i]?' win':'')+'" onclick="openCell(\''+c.id+'\','+i+')">'+cellInner(cell,i,c,pid)+'</div>';}).join('')+'</div>';
  var done=c.cells.filter(function(x,i){return cellDoneFor(c,i,pid);}).length;

// ── fill / randomize / shuffle ──
function poolFor(c){
  var p=c.pool||{},cats=(p.cats&&p.cats.length)?p.cats:catList().map(function(x){return x.id;});
  var idx=sightIndex().by,out={text:[],item:[],cat:[]};
  String(p.prompts||'').split('\n').map(function(s){return s.trim();}).filter(Boolean).forEach(function(s){out.text.push({t:'text',text:s});});
  if(p.items!==false)vals(S.items).forEach(function(it){if(cats.indexOf(it.cat)<0)return;if(p.fresh&&(idx[it.id]||[]).length)return;out.item.push({t:'item',ref:it.id});});
  if(p.wild!==false)cats.forEach(function(id){out.cat.push({t:'cat',ref:id});});
  return out;
}
function _normCells(c){
  var n=c.size,mid=(n%2===1&&c.free)?Math.floor(n*n/2):-1;
  while(c.cells.length<n*n)c.cells.push({t:'empty'});c.cells.length=n*n;
  c.cells.forEach(function(x,i){if(i===mid)c.cells[i]={t:'free'};else if(!x||x.t==='free')c.cells[i]={t:'empty'};});
}
function _keep(c,i,live){var x=c.cells[i];return x.t==='free'||x.lock||(live&&cellStampedAny(c,i));}
// which: 'empty' = only fill blank squares, 'open' = replace every unlocked/unstamped square
function fillCard(c,which,live){
  _normCells(c);
  var used={};c.cells.forEach(function(x,i){if(x.t!=='empty'&&(which==='empty'||_keep(c,i,live)))used[x.t+':'+(x.ref||x.text)]=1;});
  var pool=poolFor(c),fresh=function(a){return shuffle(a).filter(function(e){return!used[e.t+':'+(e.ref||e.text)];});};
  var slots=c.cells.map(function(x,i){return i;}).filter(function(i){return !_keep(c,i,live)&&(which!=='empty'||c.cells[i].t==='empty');});
  // your custom squares always go in first, then specific items, then "any ___" wildcards
  var picks=fresh(pool.text).concat(fresh(pool.item)).slice(0,slots.length);
  var wild=fresh(pool.cat),wi=0;
  while(picks.length<slots.length&&wild.length){picks.push(wild[wi%wild.length]);wi++;if(wi>=wild.length*3)break;}
  picks=shuffle(picks);
  slots.forEach(function(ci,k){c.cells[ci]=picks[k]?Object.assign({},picks[k]):{t:'empty'};});
  return c;
}
// keep every square, just move them around
function shufflePositions(c,live){
  _normCells(c);
  var slots=c.cells.map(function(x,i){return i;}).filter(function(i){return !_keep(c,i,live);});
  var content=shuffle(slots.map(function(i){return c.cells[i];}));
  slots.forEach(function(ci,k){c.cells[ci]=content[k];});
  return c;
}

function _djIdbGet(keys,cb){
  try{var rq=indexedDB.open('dj_images');
    rq.onupgradeneeded=function(e){try{e.target.transaction.abort();}catch(x){}cb(null);};
    rq.onsuccess=function(e){var db=e.target.result,i=0;
      if(!db.objectStoreNames.contains('imgs'))return cb(null);
      (function nx(){if(i>=keys.length)return cb(null);var k=keys[i++];
        try{var g=db.transaction('imgs','readonly').objectStore('imgs').get(k);g.onsuccess=function(){var v=g.result;if(typeof v==='string'&&v.length>200)cb(v);else nx();};g.onerror=nx;}catch(x){nx();}})();};

function djImage(it,cb){
  if(_djImgCache[it.id]!==undefined)return cb(_djImgCache[it.id]);
  var done=function(d){_djImgCache[it.id]=d||null;cb(d||null);};
  var cands=[it.image].concat(it.images||[]).filter(function(v){return typeof v==='string'&&v;});
  var direct=cands.find(function(v){return v.indexOf('data:image')===0&&v.length>200;})||cands.find(function(v){return/^https?:\/\//.test(v);});
  if(direct)return done(direct);

  _djIdbGet(keys,function(v){
    if(v)return done(v);

    var r='rooms/'+FB.room+'/images/',i=0;
    (function nx(){if(i>=keys.length)return done(null);var k=keys[i++];
      FB.db.ref(r+k).once('value').then(function(s){var v2=s.val();if(typeof v2==='string'&&v2.length>200)done(v2);else nx();}).catch(nx);})();
  });
